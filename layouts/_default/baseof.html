<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang }}">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} - {{ .Site.Title }}{{ end }}</title>

        <!-- Meta -->
        <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 160 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
        {{ if .Params.tags }}<meta name="keywords" content="{{ delimit .Params.tags ", " }}">{{ end }}
        <link rel="canonical" href="{{ .Permalink }}">

        <!-- Open Graph -->
        <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
        <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 200 }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
        <meta property="og:url" content="{{ .Permalink }}">
        <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
        <meta property="og:site_name" content="{{ .Site.Title }}">
        <meta property="og:locale" content="{{ if eq .Site.Language.Lang "zh" }}zh_CN{{ else }}en_US{{ end }}">
        <meta property="og:image" content="{{ .Site.BaseURL }}images/profile_placeholder.jpg">
        {{ if .IsPage }}
        <meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">
        <meta property="article:modified_time" content="{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}">
        <meta property="article:author" content="{{ with .Params.author }}{{ . }}{{ else }}{{ .Site.Params.name }}{{ end }}">
        {{ range .Params.tags }}
        <meta property="article:tag" content="{{ . }}">
        {{ end }}
        {{ end }}

        <!-- Twitter Card -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
        <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | plainify | truncate 200 }}{{ end }}{{ end }}">
        <meta name="twitter:image" content="{{ .Site.BaseURL }}images/profile_placeholder.jpg">

        <!-- hreflang -->
        {{ if .IsTranslated }}
          {{ range .Translations }}
        <link rel="alternate" hreflang="{{ .Site.Language.Lang }}" href="{{ .Permalink }}">
          {{ end }}
        {{ end }}
        <link rel="alternate" hreflang="x-default" href="{{ .Site.BaseURL }}">

        <!-- JSON-LD Structured Data -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "{{ if .IsPage }}Article{{ else }}WebSite{{ end }}",
            "headline": "{{ .Title }}",
            {{ if .IsPage }}
            "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
            "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
            {{ end }}
            "url": "{{ .Permalink }}",
            "description": "{{ with .Description }}{{ . | plainify }}{{ else }}{{ .Summary | plainify }}{{ end }}",
            "author": {
                "@type": "Person",
                "name": "{{ with .Params.author }}{{ . }}{{ else }}{{ .Site.Params.name }}{{ end }}"
            },
            "publisher": {
                "@type": "Organization",
                "name": "{{ .Site.Title }}"
            },
            "inLanguage": "{{ .Site.Language.Lang }}"
        }
        </script>

        <!-- RSS -->
        {{ with .Site.GetPage "home" }}
        <link rel="alternate" type="application/rss+xml" title="{{ .Site.Title }}" href="{{ "index.xml" | relURL }}">
        {{ end }}

        <!-- Favicon -->
        <link rel="apple-touch-icon" sizes="180x180" href="{{ .Site.BaseURL }}favicon_io/apple-touch-icon.png">
        <link rel="icon" type="image/png" sizes="32x32" href="{{ .Site.BaseURL }}favicon_io/favicon-32x32.png">
        <link rel="icon" type="image/png" sizes="16x16" href="{{ .Site.BaseURL }}favicon_io/favicon-16x16.png">
        <link rel="manifest" href="{{ .Site.BaseURL }}favicon_io/site.webmanifest">

        <!-- Preloads -->
        <link rel="preload" href="https://cdn.tailwindcss.com" as="script">
        <link rel="preload" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" as="style">
        <link rel="preconnect" href="https://cdn.tailwindcss.com">
        <link rel="preconnect" href="https://cdn.jsdelivr.net">
        <style>
            html, body {
                background-color: #FFFFFF;
                color: #1f2937;
            }
            html.dark, html.dark body {
                background-color: #121212;
                color: #f3f4f6;
            }
            .border {
                border-color: #d4d4d8;
            }
            html.dark .border {
                border-color: #374151;
            }
            .carousel-item {
                display: inline-block;
                margin: 0 1rem;
            }
            .flex {
                display: flex;
            }
            .flex-col {
                flex-direction: column;
            }

            @media (min-width: 768px) {
                .md\:flex-row {
                    flex-direction: row;
                }
            }

            .tech-carousel {
                overflow: hidden;
                width: 100%;
                padding: 1rem 0;
            }

            .carousel-track {
                white-space: nowrap;
            }
        </style>

        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="stylesheet" href="{{ "css/fix.css" | relURL }}">
        <link rel="stylesheet" href="{{ "css/article-content.css" | relURL }}">
        <link rel="stylesheet" type='text/css' href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />
        <script>
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        </script>
        <style>
            :root {
                color-scheme: light dark;
            }

            .tech-icon {
                filter: grayscale(100%) brightness(200%);
                transition: all 0.3s ease;
            }
            .tech-icon:hover {
                filter: none;
            }

            @keyframes scroll {
                0% {
                    transform: translateX(0);
                }
                100% {
                    transform: translateX(-100%);
                }
            }

            .tech-carousel {
                width: 100%;
                padding: 1rem 0;
            }

            .tech-track {
                width: fit-content;
                animation: scroll 20s linear infinite;
            }

            .tech-track:hover {
                animation-play-state: paused;
            }

            .tech-slide {
                float: left;
            }
        </style>
    </head>
    <body class="min-h-screen bg-bg-primary-light dark:bg-bg-primary-dark text-text-primary-light dark:text-text-primary-dark">
        {{ partial "header" . }}
        <main>
            {{ block "main" . }}{{ end }}
        </main>
        {{ partial "footer" . }}
    </body>
</html>
