[[blogs]]
title = "讨论下青年人的集体性压抑"
date = "2026-07-14"
summary = "性压抑，不是哪一个人的问题，也不是哪一个性别的问题。它是这个时代社会关系面临层层结构崩塌的结果。"
tags = ["社会观察", "性压抑", "现代性", "青年"]
content = """
如果要理解当下青年人的性压抑，首先得理解我们这一代人是在什么样的社会结构里长大的。从被压缩的现代性，到社交能力的缺失，再到西方自由文化的冲击——性的成本问题，最终指向了原子化时代的性资源错配。
"""
link = "/zh/blogs/collective-sexual-repression/"

[[blogs]]
title = "信任与边界：AI 时代开发者的生存判据"
date = "2026-10-10"
summary = "当写代码的成本趋近于零，稀缺的就不再是代码，而是理解、可排查性与边界。一篇写给开发者的职业方向长文。"
tags = ["AI", "软件工程", "职业发展", "系统思维", "前端"]
content = """
写代码这件事变便宜之后，什么变贵了，以及还能在这个行业里待下去的人，判据变成了什么。我的结论是：你能不能定义接口和验收条件，你能不能解释这套系统为什么是对的，以及它出问题的时候，你是不是那个能定位它的人。
"""
link = "/zh/blogs/trust-and-boundary/"
