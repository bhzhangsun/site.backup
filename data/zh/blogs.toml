[[blogs]]
title = "找到我的人生"
date = "2026-07-03"
summary = "一篇关于开始的短文——一个孩子与一台米色电脑相遇，从此再也没能真正离开。"
tags = ["Hugo", "人生", "编程"]
content = """
通往你热爱之人生的路上，从来没有一条笔直的线。我自己的路，是从一种声音开始的——一阵机械键盘的敲击声，从一间灯光昏暗的小房间里传出——接着是一份安静的领悟：眼前的世界，就是我一直在寻找的那个。
"""
link = "/zh/blogs/find-my-life/"

[[blogs]]
title = "讨论下青年人的集体性压抑"
date = "2026-07-14"
summary = "性压抑，不是哪一个人的问题，也不是哪一个性别的问题。它是这个时代社会关系面临层层结构崩塌的结果。"
tags = ["社会观察", "性压抑", "现代性", "青年"]
content = """
如果要理解当下青年人的性压抑，首先得理解我们这一代人是在什么样的社会结构里长大的。从被压缩的现代性，到社交能力的缺失，再到西方自由文化的冲击——性的成本问题，最终指向了原子化时代的性资源错配。
"""
link = "/zh/blogs/collective-sexual-repression/"
